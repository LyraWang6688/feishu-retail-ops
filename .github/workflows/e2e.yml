name: browser e2e

# 浏览器 E2E：静态预览 + API mock，不连真实 Base、不需要飞书登录。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/pnpm-lock.yaml') }}

      # GitHub runner 的 apt 源会偶发 DNS 失败；--with-deps 会把一次浏览器安装
      # 放大成几十个 apt 下载。runner 镜像已带 Chromium 所需系统库，这里只装浏览器，
      # 并对 CDN 下载做 3 次短重试；缓存命中时直接跳过下载。
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install chromium; then
              exit 0
            fi
            echo "Chromium install failed (attempt ${attempt}/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Run browser E2E
        run: pnpm run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 7
