name: server tests

# 并行开发时，每个 agent 都会声称“测试已通过”。这里用一个由仓库自己定义、
# 任何人（包括 agent）都改不了结果的命令来给出唯一结论。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 只跑“提交即失败”的确定性检查（单元测试）。
      # 格式、lint 之类的机械检查留在这里会拖慢 agent 的循环，不纳入本工作流。
      - run: pnpm test

      # 已知漏洞同样不允许进入 main。这一条与 Ruleset 的 required check 绑定，
      # 所以“测试过了但依赖带洞”不再是一个可以合并的状态。
      #
      # 只审计生产依赖（--prod）：开发依赖里可能存在上游尚未发布修复版本的告警
      # （例如 braces，公告要求 >=3.0.4，但该版本至今未发布）。把它算进门禁会让
      # 任何人——包括 agent——被一个无法修复的问题永久卡死，那不是门禁而是死锁。
      - run: pnpm audit --prod --audit-level=high

  # 文件大小棘轮门禁（2026-10-18 立）。
  # 与上面的 test job 分开：它**不装依赖、不读飞书**，红了能一眼看出是「文件太大」，
  # 不会和单测失败混在一起。规则与 baseline 语义见
  # docs/engineering-layering-and-file-size-2026-10-18.md。
  file-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要与 base 提交做 git diff，才能判定「既有文件净增 > 100 行」。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 纯仓库脚本：不需要 pnpm install，也不会触发依赖安装检查。
      # 本地等价命令：cd server && node scripts/check-file-size.mjs（或 pnpm run size:check）
      - name: 文件大小棘轮
        run: node scripts/check-file-size.mjs
        env:
          # PR ⇒ base 提交；push main ⇒ 上一个 main 提交。
          # 脚本解析不到时只跳过「净增」这一条（棘轮本身始终生效），不会假装通过。
          SIZE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
