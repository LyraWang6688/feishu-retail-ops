name: server tests

# 并行开发时，每个 agent 都会声称“测试已通过”。这里用一个由仓库自己定义、
# 任何人（包括 agent）都改不了结果的命令来给出唯一结论。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 只跑“提交即失败”的确定性检查（单元测试）。
      # 格式、lint 之类的机械检查留在这里会拖慢 agent 的循环，不纳入本工作流。
      - run: pnpm test

      # 已知漏洞同样不允许进入 main。这一条与 Ruleset 的 required check 绑定，
      # 所以“测试过了但依赖带洞”不再是一个可以合并的状态。
      #
      # 只审计生产依赖（--prod）：开发依赖里可能存在上游尚未发布修复版本的告警
      # （例如 braces，公告要求 >=3.0.4，但该版本至今未发布）。把它算进门禁会让
      # 任何人——包括 agent——被一个无法修复的问题永久卡死，那不是门禁而是死锁。
      - run: pnpm audit --prod --audit-level=high
