# ============================================================================
# Nginx 白名单（allowlist）—— 公共基础片段
# ============================================================================
# 作用：只放行明确列出的合法入口，其余请求一律 444（不回响应、直接断开 TCP），
#       并且不写访问日志。
#
# 历史：2026-10-05 之前用的是黑名单（snippets/block-scanners.conf，仓库里留档、
# 已不再被 include）。黑名单盖不全：它匹配的已知扫描路径有限，/.env 的前缀变体
# （/admin/.env、/config/.env、/api/.env…）照样打到应用 —— 8 小时内仍有 1107 条
# 垃圾请求进到 Express（/.env 到应用返回 401、admin/.env 之类 404）。白名单不存
# 在"盖不全"这个问题：没写进来的路径默认拒绝。
#
# 本文件只放三个站点都需要的东西：
#   1. ACME（Let's Encrypt HTTP-01）校验路径 —— 必须放行，否则证书续期会失败；
#   2. 兜底 location / —— 白名单之外的一切请求在这里被 444。
# 各站点要放行的业务路径在 allowlist-<站点>.conf 里，那些文件会 include 本文件。
#
# ============================================================================
# location 优先级（改这里之前必须读懂，搞反了会把整站弄坏）
# ============================================================================
#   1. location = /exact        精确匹配            ← 优先级最高
#   2. location ^~ /prefix/     前缀匹配（带 ^~）    ← 命中后不再尝试任何正则
#   3. location ~ ... / ~* ...  正则匹配            ← 按在配置里出现的先后顺序
#   4. location /prefix         普通前缀匹配        ← 取最长匹配的那一条
#   5. location /               普通前缀「兜底」    ← 优先级最低
#
#   结论：兜底的 location / 抢不走 = 和 ^~ 的请求，所以"白名单 + 兜底 444"这个
#   结构是安全的。本方案只用 = 和 ^~ 两种写法，不依赖"正则谁写在前面"，避免以后
#   有人插一条正则把规则顺序搞乱。
#
#   三个容易踩的坑：
#     * ^~ /workbench/ 只匹配带斜杠的 /workbench/xxx，匹配不到 /workbench 本身，
#       所以要单独写一条 location = /workbench。
#     * 同一个 server 块里不能再出现第二个 location /，否则 nginx -t 会直接报
#       duplicate location（所以站点文件里不要再写 location /）。
#     * include 是纯文本展开：本文件里的 location 就是这个 server 块的 location。
# ============================================================================

# Let's Encrypt HTTP-01 校验（webroot 方式），必须放行，否则证书续期会失败。
#
# 为什么 HTTPS 这一侧也要放行：certbot 用的是 nginx 插件
# （authenticator = nginx，见 /etc/letsencrypt/renewal/*.conf），但 api / meeting
# 的 :80 server 块里有一条 Certbot 生成的 `if ($host = ...) { return 301 https://…; }`
# —— 它在 rewrite 阶段执行、早于 location 匹配，会把 HTTP 的 challenge 请求
# 301 到 HTTPS。所以 HTTPS 侧必须也能直接把校验文件从磁盘返回，否则续期失败。
# （改造前 HTTPS 侧会把该路径转发给应用，返回 404，等于续期只能靠 certbot 临时
#   注入 server 块这一条路。）
location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    try_files $uri =404;
}

# ---------------------------------------------------------------------------
# 兜底：白名单之外的一切请求
#   access_log off  不写访问日志（扫描器垃圾不再污染业务日志）
#   return 444      不回任何响应、直接断开连接；curl 看到 http_code = 000
# 注意：必须放在本 server 块的最后一个 location 位置之外——nginx 不关心顺序，
# 但一个 server 块里只能有一个 location /。
# ---------------------------------------------------------------------------
location / {
    access_log off;
    return 444;
}
