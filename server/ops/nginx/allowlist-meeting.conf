# ============================================================================
# meeting.bamamei.online 白名单（**不是本项目**：Docker 容器 meeting-analysis，
# Next.js 应用，上游 127.0.0.1:3011）
# ============================================================================
# 原则：这个站点不归我们开发，所以放行清单完全按**它自己的构建产物**来定，
# 一条不多放、一条不少放，避免白名单把它弄坏。
#
# 依据（都是实际读出来的，不是猜的）：
#   1. 容器内 /app/.next/app-path-routes-manifest.json（页面 + 全部 route handler）
#   2. 容器内 /app/public/（站点根目录下的静态文件）
#   3. 近 8 小时 nginx access.log 里真实出现的 200 路径
#
# 页面（Next.js app router）：
#   /             → 307 重定向到 /feishu-config（routes-manifest 里的 redirect）
#   /feishu-config  200
#   /login          200
#   /report、/report/、/report/<publicId>、/report/v2/<publicId>
#                   报表页（分享链接形式，是给外部人看的，必须放行）
#   /_not-found、/_global-error   Next 内部页面
#   末尾带斜杠的 /login/、/feishu-config/ 也要放行：Next 有一条
#   `/:path+/ → /:path+`（308）的规范化重定向，不放行这两个就轮不到它重定向。
#
# 静态资源：/_next/...（构建产物，文件名带 hash；不放行 = 报表页白屏）
#   /favicon.ico、/robots.txt 是 Next 的 route handler（manifest 里
#   "/favicon.ico/route"、"/robots.txt/route"），改造前都是 200、浏览器每次都会请求，
#   必须放行（第一版白名单漏了这两条，实测被 444 挡掉，已修）。
# public/ 下的 5 个文件：/file.svg /globe.svg /next.svg /vercel.svg /window.svg
#   （构建产物里 grep 不到引用，但它们是应用 public/ 目录的真实内容，一并放行）
#
# 接口（app-path-routes-manifest.json 里 route handler 的全集）：
#   /api/auth/{me,login,logout,callback}
#   /api/analyze、/api/analyze/tasks、/api/analyze/tasks/<taskId>
#   /api/feishu/record、/api/feishu/oauth/callback、/api/feishu/reauth/start、
#   /api/feishu/integrations[/<integrationId>][/authorize/start|/authorize/poll|
#                                /checks|/create-app|/register/poll]
#   /api/client-log、/api/feedback、/api/project-org-targets/active
#
# 这里**故意不写** `^~ /api/`（整段放行）：整段放行会让 /api/.env 这类扫描路径
# 继续打到应用（改造前黑名单是 444 的）。逐条列出才符合"白名单"的本意。
#
# ⚠️ meeting 应用以后**新增页面或接口，必须回到这个文件加一条**，否则新入口会被
#    兜底的 444 挡掉（现象是"页面/接口突然连不上"，不是 404）。
#
# 上游参数统一放在 proxy-meeting.conf（与改造前的 location / 逐行一致，
# 包括 300s 超时）。
# ============================================================================

include /etc/nginx/snippets/allowlist.conf;

# --- 页面 --------------------------------------------------------------------
location = /                     { include /etc/nginx/snippets/proxy-meeting.conf; }  # 307 → /feishu-config
location = /feishu-config        { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /feishu-config/       { include /etc/nginx/snippets/proxy-meeting.conf; }  # Next 会 308 规范化
location = /login                { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /login/               { include /etc/nginx/snippets/proxy-meeting.conf; }  # Next 会 308 规范化
location = /_not-found           { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /_global-error        { include /etc/nginx/snippets/proxy-meeting.conf; }

# 报表页：/report 本身 + /report/、/report/<id>、/report/v2/<id>
location = /report               { include /etc/nginx/snippets/proxy-meeting.conf; }
location ^~ /report/             { include /etc/nginx/snippets/proxy-meeting.conf; }

# --- 静态资源 ----------------------------------------------------------------
location ^~ /_next/              { include /etc/nginx/snippets/proxy-meeting.conf; }  # 构建产物，缺了就白屏
location = /favicon.ico          { include /etc/nginx/snippets/proxy-meeting.conf; }  # Next route handler，改造前 200
location = /robots.txt           { include /etc/nginx/snippets/proxy-meeting.conf; }  # Next route handler，改造前 200
location = /file.svg             { include /etc/nginx/snippets/proxy-meeting.conf; }  # public/
location = /globe.svg            { include /etc/nginx/snippets/proxy-meeting.conf; }  # public/
location = /next.svg             { include /etc/nginx/snippets/proxy-meeting.conf; }  # public/
location = /vercel.svg           { include /etc/nginx/snippets/proxy-meeting.conf; }  # public/
location = /window.svg           { include /etc/nginx/snippets/proxy-meeting.conf; }  # public/

# --- 接口 --------------------------------------------------------------------
location ^~ /api/auth/           { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /api/analyze          { include /etc/nginx/snippets/proxy-meeting.conf; }
location ^~ /api/analyze/        { include /etc/nginx/snippets/proxy-meeting.conf; }
location ^~ /api/feishu/         { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /api/client-log       { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /api/feedback         { include /etc/nginx/snippets/proxy-meeting.conf; }
location = /api/project-org-targets/active { include /etc/nginx/snippets/proxy-meeting.conf; }
