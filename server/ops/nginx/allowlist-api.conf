# ============================================================================
# api.bamamei.online 白名单（本项目 Express 应用，上游 127.0.0.1:5000）
# ============================================================================
# 放行清单是怎么确认的（读 server/src/app.js 与各 route 文件，不是猜的）：
#   /                     app.js:56  app.get('/') → 工作台首页（飞书网页应用回落）
#   /health               app.js:60  GET → JSON（version / commit / 部署时间）
#   /api/lark/events      app.js:48  飞书事件回调：POST /（+ GET /health 健康检查）
#   /api/auth/feishu/*    app.js:50  GET /me /start /callback、POST /logout
#   /api/workbench/*      app.js:53  工作台查询、补记收款、交付扣库存
#   其余 /api/*           app.js:73  由 API_KEY（x-api-key 头）中间件保护
#
#   这里用 ^~ /api/ 整段放行，而不是逐条列：漏掉 /api/lark/events 就等于把机器人
#   弄哑（飞书事件全部失败），而整个 /api/ 在改造前本来就是全部转发给应用的，
#   所以这一条不新增任何暴露面。
#
#   /workbench/ 也放行：同一套应用在 api 域名下本来就能打开工作台
#   （改造前 GET https://api.bamamei.online/workbench/main.js 就是 200），
#   不放行等于把已经能用的地址变成 000。
#
# 本文件只含"应用自己的入口"；除此之外（静态目录、后台、扫描路径…）落到
# allowlist.conf 的兜底 location / → 444 + 不写日志。
# ============================================================================

include /etc/nginx/snippets/allowlist.conf;

# 工作台首页（回落）。
# 注意 location = / 是精确匹配，只吃 "/" 这一个请求，不吃 /anything。
location = / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 健康检查
location = /health {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 飞书回调 / 飞书网页登录 / 工作台接口 / 其余受 API_KEY 保护的接口。
# ^~ 前缀匹配：/api/anything 都放行；优先级高于兜底的 location /。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /workbench（无斜杠）→ /workbench/。
# 必须单独写：^~ /workbench/ 匹配不到没有斜杠的 /workbench。
# Express 的 express.static 对这种情况也是 301，行为保持一致。
location = /workbench {
    return 301 /workbench/;
}

# 工作台静态资源：index.html / main.js / standalone.js / inventory.html /
# sales-today.html / core/*.js / styles/*.css / features/**/*.js|css
location ^~ /workbench/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
