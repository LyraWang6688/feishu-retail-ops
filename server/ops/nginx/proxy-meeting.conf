# ============================================================================
# meeting.bamamei.online 的上游转发参数（**不是本项目**）
# ============================================================================
# meeting.bamamei.online 是 Docker 容器 meeting-analysis（Next.js 应用），
# nginx 转发到 127.0.0.1:3011。
#
# 为什么单独抽一个文件：白名单里每一条放行路径都要用同一套上游参数，而 nginx
# 没有"宏"，同一个 location 里只能写一次 proxy_pass。原来这 9 行是写在一条
# location / 里的，现在被 allowlist-meeting.conf 里十几条 location 共用。
#
# 内容与改造前的 `location /` 完全一致，特别保留 300s 超时：
# 分析任务跑得久，超时调小会把长请求掐断。
# ============================================================================

proxy_pass http://127.0.0.1:3011;
proxy_http_version 1.1;

proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
