# ============================================================================
# workbench.bamamei.online 白名单（本项目 Express 应用，上游 127.0.0.1:5000）
# ============================================================================
# 与 api.bamamei.online 的白名单差异：
#   * 首页入口不同：这里 location = / 转发到应用内部的 /workbench/（改造前就是
#     这样：飞书网页应用配置的主页是 https://workbench.bamamei.online/）；
#   * X-Forwarded-Proto 改造前就硬编码为 https，这里保持不动；
#   * 不放行 /health：改造前这个域名下 /health 是 404（nginx 里没有对应
#     location），健康检查走 api 域名，这里不新增入口。
#
# 放行的路径（依据 server/public/workbench/ 实际文件与 app.js 路由）：
#   /              → /workbench/ 首页（Express 回落）
#   /workbench/     工作台静态资源。首页 index.html 逐个引用了这些（缺一个就白屏）：
#                     /workbench/styles/tokens.css
#                     /workbench/styles/base.css
#                     /workbench/features/sales/sales.css
#                     /workbench/features/purchase/purchase.css
#                     /workbench/features/inventory/inventory.css
#                     /workbench/main.js  → 再 import ./core/*.js 与 ./features/**/index.js
#                   另外 inventory.html / sales-today.html / standalone.js 也在
#                   这个目录里，是独立页面入口，一并放行。
#   /api/           工作台自己的接口：
#                     /api/auth/feishu/{me,start,callback}（GET）、logout（POST）
#                     /api/workbench/sales/today|orders|payments|deliveries、/inventory、
#                     /api/workbench/purchase/requests|arrivals
#                   整段 ^~ /api/ 放行，与改造前完全一致（改造前就是 location /api/）。
# ============================================================================

include /etc/nginx/snippets/allowlist.conf;

# 首页：精确匹配 "/"，转发到应用内部的 /workbench/
location = / {
    proxy_pass http://127.0.0.1:5000/workbench/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# /workbench（无斜杠）→ /workbench/。
# 改造前这条请求是 404（nginx 只写了 location /workbench/），这里补一条 301：
# 只影响一个截图里的手输地址，不影响任何正常入口。
location = /workbench {
    return 301 /workbench/;
}

# 工作台静态资源（前端一套 js/css/html 都在这个前缀下）
location ^~ /workbench/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 工作台接口（飞书登录 + 销售/采购/库存查询与写操作）
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
