# 互联网扫描器会无差别探测配置文件路径（/.env、/wp-config.php、/.git …）。
# 这些请求对我们没有任何意义：直接断开连接（444）、并且不写访问日志。
# 目的：业务日志干净可读 —— 排查问题时不必在几千条垃圾里找自己那一单。
#
# 只匹配明确的扫描路径，不碰 /api/、/workbench/、/health 这些真实入口。
location ~* ^/(\.env|\.git|\.svn|\.aws|\.ssh|\.kube|\.npmrc|\.s3cfg|\.DS_Store|wp-|wordpress|phpmyadmin|phpunit|adminer|xmlrpc\.php|eval-stdin|docker-compose|docker/|k8s|kubernetes|jenkins|graphql|swagger|api-docs|actuator|telescope|horizon|config\.php|\.sql|\.sqlite|db\.sql|backup\.sql|dump\.sql) {
    access_log off;
    return 444;
}
