<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>邯美工作台</title>
  <link rel="stylesheet" href="/workbench/styles/tokens.css">
  <link rel="stylesheet" href="/workbench/styles/base.css">
  <link rel="stylesheet" href="/workbench/procurement.css?v=20261122-4">
</head>
<body>
  <!-- 采购页薄壳：DOM 结构在 features/procurement/render.js，文案/端点在 config/procurement.js。

  <main id="procurement-app" class="shell pr-page"></main>
  <script src="/workbench/shared/ui-tap.js"></script>
  <script>if (window.dshUiTap) window.dshUiTap.bind({ path: '/api/workbench/ui-tap', page: 'workbench' });</script>
  <script type="module">
    import { syncUserTitle } from '/workbench/core/userTitle.js';
    syncUserTitle();
  </script>
  <script type="module">
    import { mountProcurementPage } from '/workbench/features/procurement/index.js';
    mountProcurementPage(document.getElementById('procurement-app'));
  </script>
</body>
</html>
