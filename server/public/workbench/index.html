<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- ⭐ 2026-10-13：明确"没有图标" —— 免得浏览器自己去请求 /favicon.ico 报空响应 ✗（她截图里那条） -->
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>邯美工作台</title>
  <!-- ⭐ 主题唯一真源 = styles/tokens.css（配色 / 间距 / 圆角 / 字号都在那一个文件里）。 -->
  <link rel="stylesheet" href="/workbench/styles/tokens.css">
  <link rel="stylesheet" href="/workbench/styles/base.css">
  <!-- 四个业务领域 tab 的骨架样式（移动优先：单列卡片、按钮 ≥44px、不横向滚动）。 -->
  <link rel="stylesheet" href="/workbench/features/domains/domains.css">
  <!-- 订单列表（业务负责人 2026-10-09）：一列卡片、按钮 ≥44px、不横向滚动（移动端友好）。 -->
  <link rel="stylesheet" href="/workbench/features/orders/orders.css">
  <!-- 库存流水：沿用同一套 tokens；四列在手机上不横向滚动。 -->
  <!-- 统一日期控件：可见外框 + 透明原生日期输入（2026-11-22）。 -->
  <link rel="stylesheet" href="/workbench/features/shared/dateField.css?v=20261122-1">
  <link rel="stylesheet" href="/workbench/features/inventory/ledger.css?v=20261122-1">
  <!-- 销售查询：销售额 / 交易方式 / 销售数量 / 按单区块；沿用同一套 tokens。 -->
  <link rel="stylesheet" href="/workbench/features/sales-query/sales-query.css?v=20261122-1">
</head>
<body>
  <main class="shell">
    <!--
      ⭐⭐ 一级 tab = 业务负责人 2026-10-09 定的**四个业务领域**（按领域分，不再按动作分），
      顺序从左往右：**销售 · 库存 · 采购 · 货品**。
      ⚠️ **文案与顺序不在这个文件里** —— 唯一来源是 `config/tabs.js` 的 `MAIN_TABS`，
         由 `main.js` 用 `core/tabs.js` 的 `mainTabsHtml()` 渲染进来（配置先行）。
      ⚠️ 每个领域有哪些子页面在 `config/domains.js`（销售建单 / 订单列表 / 销售查询 · …）。
      ⚠️ 旧的一级 tab（信息录入 / 信息查询 / 订单列表）**一个都没删**：
         它们的页面与模块都还在，入口收在**页脚那一行「其它 / 历史功能」**里。
    -->
    <nav id="main-tabs" class="main-tabs" aria-label="工作台模块"></nav>

    <section id="module-host" aria-live="polite"></section>
    <p id="page-error" class="error hidden" role="alert"></p>

    <!--
      ⚠️ 2026-10-09：原先这里有一行「其它 / 历史功能」入口（→ `others.html`）。
      业务负责人点头把那一页与它底下的老页面（信息录入首页 / 采购管理 / 采购退货独立页）
      **一起删掉**（「代码从仓库里删，不是隐藏」）⇒ 这一行连同 `config/others.js` 一起删除。
      ⭐ 四个领域 tab（`config/domains.js`）上已有等价入口，功能一个都没少。
      页脚现在只剩扫码入口那半句。
    -->
    <!--
      ⭐ 2026-10-10（业务负责人真机反馈：「下面的这些文字解释就不用了」）：
      页脚只留**功能性的指向**（"扫码入口在哪"），不再解释扫码页怎么用
      （原先那半句「（页面顶部可切换 销售 / 库存 / 采购 / 货品）」已删）。
    -->
  </main>
  <!-- tap telemetry: the ONE shared client implementation (also inlined by the scan page).
       It must load BEFORE the module script: the modules read window.dshUiTap. -->
  <script src="/workbench/shared/ui-tap.js"></script>
  <script src="/workbench/shared/funnel.js"></script>
  <script>if (window.dshFunnel) { dshFunnel.view("workbench", { step: "home" }); }</script>
  <script src="/workbench/shared/toast.js" defer></script>
  <script type="module" src="/workbench/main.js"></script>
</body>
</html>
