<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>邯美数智经营工作台</title>
  <link rel="stylesheet" href="/workbench/styles/tokens.css">
  <link rel="stylesheet" href="/workbench/styles/base.css">
  <link rel="stylesheet" href="/workbench/features/common/common.css">
  <link rel="stylesheet" href="/workbench/features/sales/sales.css">
  <link rel="stylesheet" href="/workbench/features/purchase/purchase.css">
  <link rel="stylesheet" href="/workbench/features/inventory/inventory.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <div class="eyebrow">邯美数智经营工作台</div>
        <h1>经营管理中心</h1>
      </div>
      <div class="auth">
        <span id="auth-status" class="muted">正在检查飞书登录状态…</span>
        <button id="logout" class="btn btn-ghost hidden" type="button">退出登录</button>
      </div>
    </header>

    <!--
      一级 tab 只有 3 个（业务负责人 2026-10-06 定的）：
        常用功能 · 销售查询 · 实时库存
      ⚠️ 「采购管理 / 资金管理 / 抖音运营 / 平台管理」**只是把入口隐去**——
        对应模块的代码仍然在 main.js 的 modules 里（见那里的 HIDDEN 注释），
        要恢复只加回一个 <button class="main-tab" data-module="..."> 即可，不用改逻辑。
      三个 tab 各自都有独立页面：common.html / sales-query.html / inventory.html。
    -->
    <nav id="main-tabs" class="main-tabs" aria-label="工作台模块">
      <button class="main-tab active" type="button" data-module="common">常用功能</button>
      <button class="main-tab" type="button" data-module="sales">销售查询</button>
      <button class="main-tab" type="button" data-module="inventory">实时库存</button>
    </nav>

    <section id="module-host" aria-live="polite"></section>
    <p id="page-error" class="error hidden" role="alert"></p>
  </main>
  <script type="module" src="/workbench/main.js"></script>
</body>
</html>
