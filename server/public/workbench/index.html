<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>邯美数智经营工作台</title>
  <!-- ⭐ 主题唯一真源 = styles/tokens.css（配色 / 间距 / 圆角 / 字号都在那一个文件里）。 -->
  <link rel="stylesheet" href="/workbench/styles/tokens.css">
  <link rel="stylesheet" href="/workbench/styles/base.css">
  <link rel="stylesheet" href="/workbench/features/common/common.css">
  <link rel="stylesheet" href="/workbench/features/purchase/purchase.css">
  <!-- 四个业务领域 tab 的骨架样式（移动优先：单列卡片、按钮 ≥44px、不横向滚动）。 -->
  <link rel="stylesheet" href="/workbench/features/domains/domains.css">
  <!-- 订单列表（业务负责人 2026-10-09）：一列卡片、按钮 ≥44px、不横向滚动（移动端友好）。 -->
  <link rel="stylesheet" href="/workbench/features/orders/orders.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <div class="eyebrow">邯美数智经营工作台</div>
        <h1>经营管理中心</h1>
      </div>
      <div class="auth">
        <span id="auth-status" class="muted">正在检查飞书登录状态…</span>
        <button id="logout" class="btn btn-ghost hidden" type="button">退出登录</button>
      </div>
    </header>

    <!--
      ⭐⭐ 一级 tab = 业务负责人 2026-10-09 定的**四个业务领域**（按领域分，不再按动作分），
      顺序从左往右：**销售 · 库存 · 采购 · 货品**。
      ⚠️ **文案与顺序不在这个文件里** —— 唯一来源是 `config/tabs.js` 的 `MAIN_TABS`，
         由 `main.js` 用 `core/tabs.js` 的 `mainTabsHtml()` 渲染进来（配置先行）。
      ⚠️ 每个领域有哪些子页面在 `config/domains.js`（销售建单 / 订单列表 / 销售查询 · …）。
      ⚠️ 旧的一级 tab（信息录入 / 信息查询 / 订单列表）**一个都没删**：
         它们的页面与模块都还在，入口收在**页脚那一行「其它 / 历史功能」**里。
    -->
    <nav id="main-tabs" class="main-tabs" aria-label="工作台模块"></nav>

    <section id="module-host" aria-live="polite"></section>
    <p id="page-error" class="error hidden" role="alert"></p>

    <!--
      ⚠️ 2026-10-09：原先这里有一行「其它 / 历史功能」入口（→ `others.html`）。
      业务负责人点头把那一页与它底下的老页面（信息录入首页 / 采购管理 / 采购退货独立页）
      **一起删掉**（「代码从仓库里删，不是隐藏」）⇒ 这一行连同 `config/others.js` 一起删除。
      ⭐ 四个领域 tab（`config/domains.js`）上已有等价入口，功能一个都没少。
      页脚现在只剩扫码入口那半句。
    -->
    <p class="foot-links">
      <span>扫码入口：扫鞋盒标签上的二维码（页面顶部可切换 销售 / 库存 / 采购 / 货品）</span>
    </p>
  </main>
  <script type="module" src="/workbench/main.js"></script>
</body>
</html>
